<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Follow-Through">
  <meta name="theme-color" content="#667eea">
  <title>2026: Year of Follow-Through</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 10px;
      overflow-x: hidden;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    
    .header {
      background: white;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    
    h1 {
      color: #2d3748;
      font-size: 1.5em;
      margin-bottom: 5px;
    }
    
    .subtitle {
      color: #718096;
      font-size: 0.9em;
    }
    
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 10px;
      margin-top: 15px;
    }
    
    .stat-card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 15px;
      border-radius: 10px;
      color: white;
      text-align: center;
    }
    
    .stat-card h3 {
      font-size: 0.75em;
      opacity: 0.9;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .stat-card .value {
      font-size: 2em;
      font-weight: bold;
    }
    
    .week-nav {
      background: white;
      padding: 15px;
      border-radius: 15px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    
    .week-nav button {
      background: #667eea;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85em;
      transition: background 0.3s;
      touch-action: manipulation;
    }
    
    .week-nav button:active {
      background: #5568d3;
      transform: scale(0.95);
    }
    
    .week-info {
      text-align: center;
      font-weight: 600;
      color: #2d3748;
      font-size: 0.9em;
    }
    
    .category {
      background: white;
      border-radius: 15px;
      margin-bottom: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      overflow: hidden;
    }
    
    .category-header {
      background: linear-gradient(90deg, #f7fafc 0%, #edf2f7 100%);
      padding: 15px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #e2e8f0;
      touch-action: manipulation;
    }
    
    .category-header:active {
      background: linear-gradient(90deg, #edf2f7 0%, #e2e8f0 100%);
    }
    
    .category-title {
      font-size: 1.1em;
      font-weight: 600;
      color: #2d3748;
    }
    
    .category-score {
      font-size: 1em;
      font-weight: bold;
      padding: 5px 12px;
      border-radius: 20px;
    }
    
    .score-high { background: #c6f6d5; color: #22543d; }
    .score-med { background: #fef08a; color: #854d0e; }
    .score-low { background: #fed7d7; color: #742a2a; }
    
    .habit-grid {
      display: none;
      padding: 10px;
    }
    
    .habit-grid.active {
      display: block;
    }
    
    .habit-row {
      display: grid;
      grid-template-columns: 2fr 60px repeat(7, 1fr);
      gap: 5px;
      padding: 12px 5px;
      border-bottom: 1px solid #e2e8f0;
      align-items: center;
    }
    
    .habit-name {
      font-weight: 500;
      color: #2d3748;
      font-size: 0.9em;
    }
    
    .habit-target {
      font-size: 0.7em;
      color: #718096;
    }
    
    .habit-percent {
      text-align: center;
      font-weight: 600;
      font-size: 0.9em;
    }
    
    .day-cell {
      text-align: center;
    }
    
    .checkbox {
      width: 28px;
      height: 28px;
      border: 2px solid #cbd5e0;
      border-radius: 50%;
      cursor: pointer;
      display: inline-block;
      transition: all 0.2s;
      position: relative;
      touch-action: manipulation;
    }
    
    .checkbox:active {
      transform: scale(0.9);
    }
    
    .checkbox.checked {
      background: #48bb78;
      border-color: #48bb78;
    }
    
    .checkbox.checked::after {
      content: '✓';
      color: white;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 16px;
      font-weight: bold;
    }
    
    .checkbox.inactive {
      background: #f7fafc;
      border-color: #e2e8f0;
      cursor: default;
    }
    
    .checkbox.missed {
      border-color: #fc8181;
      background: #fff5f5;
    }
    
    .day-headers {
      display: grid;
      grid-template-columns: 2fr 60px repeat(7, 1fr);
      gap: 5px;
      padding: 12px 10px;
      background: #f7fafc;
      font-weight: 600;
      color: #4a5568;
      border-bottom: 2px solid #e2e8f0;
      font-size: 0.75em;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    
    .day-header {
      text-align: center;
    }
    
    input[type="number"] {
      width: 50px;
      padding: 4px;
      border: 2px solid #cbd5e0;
      border-radius: 5px;
      text-align: center;
      font-size: 0.85em;
    }
    
    .install-prompt {
      background: #667eea;
      color: white;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
      display: none;
      align-items: center;
      justify-content: space-between;
    }
    
    .install-prompt.show {
      display: flex;
    }
    
    .install-prompt button {
      background: white;
      color: #667eea;
      border: none;
      padding: 8px 15px;
      border-radius: 5px;
      font-weight: 600;
      cursor: pointer;
    }
    
    @media (max-width: 768px) {
      h1 { font-size: 1.3em; }
      .habit-row {
        grid-template-columns: 1fr 50px repeat(7, 32px);
        gap: 3px;
      }
      .habit-name { font-size: 0.8em; }
      .checkbox { width: 24px; height: 24px; }
      .day-headers { font-size: 0.7em; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="install-prompt" id="install-prompt">
      <span>📱 Add to your home screen for easy access!</span>
      <button onclick="hideInstallPrompt()">Got it</button>
    </div>
    
    <div class="header">
      <h1>2026: Year of Follow-Through</h1>
      <p class="subtitle">I become what I repeatedly do</p>
      
      <div class="stats">
        <div class="stat-card">
          <h3>Score</h3>
          <div class="value" id="total-score">0%</div>
        </div>
        <div class="stat-card">
          <h3>Habits</h3>
          <div class="value">15</div>
        </div>
        <div class="stat-card">
          <h3>Checks</h3>
          <div class="value" id="week-total">0</div>
        </div>
      </div>
    </div>
    
    <div class="week-nav">
      <button onclick="changeWeek(-1)">← Prev</button>
      <div class="week-info" id="week-display"></div>
      <button onclick="changeWeek(1)">Next →</button>
    </div>
    
    <div class="day-headers">
      <div>Habit</div>
      <div style="text-align: center;">%</div>
      <div class="day-header">Su</div>
      <div class="day-header">M</div>
      <div class="day-header">Tu</div>
      <div class="day-header">W</div>
      <div class="day-header">Th</div>
      <div class="day-header">F</div>
      <div class="day-header">Sa</div>
    </div>
    
    <div id="habits-container"></div>
  </div>

  <script>
    let currentWeekOffset = 0;
    let habitData = {};
    
    // Check if running as installed PWA
    function checkInstallStatus() {
      const isStandalone = window.matchMedia('(display-mode: standalone)').matches 
        || window.navigator.standalone 
        || document.referrer.includes('android-app://');
      
      const hasSeenPrompt = localStorage.getItem('hasSeenInstallPrompt');
      
      if (!isStandalone && !hasSeenPrompt) {
        document.getElementById('install-prompt').classList.add('show');
      }
    }
    
    function hideInstallPrompt() {
      document.getElementById('install-prompt').classList.remove('show');
      localStorage.setItem('hasSeenInstallPrompt', 'true');
    }
    
    // Load data from localStorage
    function loadData() {
      const saved = localStorage.getItem('habitTrackerData');
      if (saved) {
        try {
          habitData = JSON.parse(saved);
        } catch (e) {
          console.error('Error loading data:', e);
          habitData = {};
        }
      }
    }
    
    // Save data to localStorage
    function saveData() {
      try {
        localStorage.setItem('habitTrackerData', JSON.stringify(habitData));
      } catch (e) {
        console.error('Error saving data:', e);
      }
    }
    
    // Get week start date
    function getWeekStart(offset = 0) {
      const today = new Date();
      const day = today.getDay();
      const diff = today.getDate() - day + (offset * 7);
      const weekStart = new Date(today);
      weekStart.setDate(diff);
      weekStart.setHours(0, 0, 0, 0);
      return weekStart;
    }
    
    // Get dates for the week
    function getWeekDates() {
      const weekStart = getWeekStart(currentWeekOffset);
      const dates = [];
      for (let i = 0; i < 7; i++) {
        const date = new Date(weekStart);
        date.setDate(weekStart.getDate() + i);
        dates.push(date);
      }
      return dates;
    }
    
    // Format date for storage
    function formatDate(date) {
      return date.toISOString().split('T')[0];
    }
    
    // Habit definitions
    const categories = {
      'Daily Discipline': [
        { id: 'bedtime', name: 'Bedtime by 9:30pm', target: 'Sun-Thu', targetDays: [0,1,2,3,4] },
        { id: 'phone-free', name: 'Phone-free morning (20 min)', target: '5x/week' },
        { id: 'journal', name: 'Journal', target: '4x/week' },
        { id: 'reading', name: 'Read before bed', target: 'M-F', targetDays: [1,2,3,4,5] },
        { id: 'no-beers', name: 'No weekday fridge beers', target: 'M-F', targetDays: [1,2,3,4,5] },
        { id: 'meal-prep', name: 'Meal prep lunches', target: 'Weekly', weekly: true }
      ],
      'Physical Readiness': [
        { id: 'workout', name: 'Workout (Run/Gym/Kettlebell)', target: '4x/week' },
        { id: 'walks', name: 'Intentional walk', target: '3x/week' },
        { id: 'weight', name: 'Weight (lbs)', target: 'Track', type: 'number', weekly: true }
      ],
      'Family & Friends': [
        { id: 'solo-dad', name: 'Solo dad time with Artie', target: '1x/week' },
        { id: 'stay-in-touch', name: 'Meaningful contact', target: '2x/week' },
        { id: 'photo-dump', name: 'Sunday photo collection', target: 'Weekly', targetDays: [0], weekly: true }
      ]
    };
    
    // Toggle habit
    function toggleHabit(habitId, dateStr) {
      const key = `${habitId}-${dateStr}`;
      habitData[key] = !habitData[key];
      saveData();
      render();
    }
    
    // Update weight
    function updateWeight(dateStr, value) {
      habitData[`weight-${dateStr}`] = value;
      saveData();
    }
    
    // Calculate completion percentage
    function getCompletion(habitId, targetDays) {
      const dates = getWeekDates();
      let completed = 0;
      let applicable = 0;
      
      dates.forEach((date, index) => {
        if (!targetDays || targetDays.includes(index)) {
          applicable++;
          const key = `${habitId}-${formatDate(date)}`;
          if (habitData[key]) completed++;
        }
      });
      
      return applicable > 0 ? Math.round((completed / applicable) * 100) : 0;
    }
    
    // Change week
    function changeWeek(offset) {
      currentWeekOffset += offset;
      render();
    }
    
    // Toggle category
    function toggleCategory(categoryName) {
      const element = document.getElementById(`cat-${categoryName.replace(/\s+/g, '-')}`);
      if (element) {
        element.classList.toggle('active');
      }
    }
    
    // Render the UI
    function render() {
      const dates = getWeekDates();
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      
      const weekDisplay = document.getElementById('week-display');
      weekDisplay.textContent = `${dates[0].toLocaleDateString('en-US', { month: 'short', day: 'numeric' })} - ${dates[6].toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}`;
      
      let totalScore = 0;
      let totalHabits = 0;
      let weekTotal = 0;
      
      const container = document.getElementById('habits-container');
      container.innerHTML = '';
      
      Object.entries(categories).forEach(([categoryName, habits]) => {
        const categoryDiv = document.createElement('div');
        categoryDiv.className = 'category';
        
        let categoryScore = 0;
        habits.forEach(habit => {
          const score = getCompletion(habit.id, habit.targetDays);
          categoryScore += score;
          totalScore += score;
          totalHabits++;
        });
        categoryScore = Math.round(categoryScore / habits.length);
        
        const scoreClass = categoryScore >= 75 ? 'score-high' : categoryScore >= 50 ? 'score-med' : 'score-low';
        
        const habitRows = habits.map(habit => {
          const percent = getCompletion(habit.id, habit.targetDays);
          const dayCells = dates.map((date, index) => {
            const dateStr = formatDate(date);
            const isApplicable = !habit.targetDays || habit.targetDays.includes(index);
            const isChecked = habitData[`${habit.id}-${dateStr}`];
            const isPast = date < today;
            
            if (habit.type === 'number') {
              if (habit.weekly && index !== 0) {
                return '<div class="day-cell">-</div>';
              }
              const value = habitData[`weight-${dateStr}`] || '';
              return `<div class="day-cell"><input type="number" placeholder="lbs" value="${value}" onchange="updateWeight('${dateStr}', this.value); render();"></div>`;
            }
            
            if (habit.weekly && index !== 0) {
              return '<div class="day-cell">-</div>';
            }
            
            if (!isApplicable) {
              return '<div class="day-cell"><div class="checkbox inactive"></div></div>';
            }
            
            if (isChecked) weekTotal++;
            
            const missedClass = isPast && !isChecked && isApplicable ? 'missed' : '';
            
            return `<div class="day-cell"><div class="checkbox ${isChecked ? 'checked' : ''} ${missedClass}" onclick="toggleHabit('${habit.id}', '${dateStr}')"></div></div>`;
          }).join('');
          
          return `
            <div class="habit-row">
              <div>
                <div class="habit-name">${habit.name}</div>
                <div class="habit-target">${habit.target}</div>
              </div>
              <div class="habit-percent">${percent}%</div>
              ${dayCells}
            </div>
          `;
        }).join('');
        
        categoryDiv.innerHTML = `
          <div class="category-header" onclick="toggleCategory('${categoryName}')">
            <div class="category-title">${categoryName}</div>
            <div class="category-score ${scoreClass}">${categoryScore}%</div>
          </div>
          <div class="habit-grid active" id="cat-${categoryName.replace(/\s+/g, '-')}">
            ${habitRows}
          </div>
        `;
        
        container.appendChild(categoryDiv);
      });
      
      document.getElementById('total-score').textContent = Math.round(totalScore / totalHabits) + '%';
      document.getElementById('week-total').textContent = weekTotal;
    }
    
    // Initialize
    loadData();
    checkInstallStatus();
    render();
    
    // Refresh view when coming back to the app
    document.addEventListener('visibilitychange', function() {
      if (!document.hidden) {
        render();
      }
    });
  </script>
</body>
</html>
